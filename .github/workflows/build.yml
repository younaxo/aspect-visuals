name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Проверка шейдеров
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
          node tools/check-shaders.mjs
          for F in src/main/resources/assets/aspectvisuals/shaders/core/*.vsh; do
            echo "vert: $F"; glslangValidator -S vert "$F"
          done
          for F in src/main/resources/assets/aspectvisuals/shaders/core/*.fsh; do
            echo "frag: $F"; glslangValidator -S frag "$F"
          done

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: aspect-visuals
          path: build/libs/*.jar
          if-no-files-found: error
