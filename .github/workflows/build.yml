name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Имя артефакта
        id: meta
        env:
          # В прогоне на pull request github.sha указывает на merge-коммит,
          # а нужен именно тот, который собираем
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          echo "artifact=aspect-visuals-$VERSION (${HEAD_SHA:0:7})" >> "$GITHUB_OUTPUT"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Проверка шейдеров
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq glslang-tools
          node tools/check-shaders.mjs
          for F in src/main/resources/assets/aspectvisuals/shaders/core/*.vsh; do
            echo "vert: $F"; glslangValidator -S vert "$F"
          done
          for F in src/main/resources/assets/aspectvisuals/shaders/core/*.fsh; do
            echo "frag: $F"; glslangValidator -S frag "$F"
          done

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      - name: Build
        run: ./gradlew build --stacktrace

      # Временный шаг: подтверждает API окна перед заменой значка и заголовка.
      - name: Разведка окна
        if: always()
        run: |
          set +e
          NAMED=""
          for J in $(find ~/.gradle -name "*.jar" 2>/dev/null | grep -i minecraft | grep -viE "sources|javadoc"); do
            if unzip -l "$J" 2>/dev/null | grep -q "net/minecraft/client/util/Window.class"; then NAMED="$J"; break; fi
          done
          echo "== Window: заголовок и значок"
          javap -p -cp "$NAMED" net.minecraft.client.util.Window 2>&1 | grep -iE "title|icon" | head -10
          echo "== MinecraftClient: заголовок"
          javap -p -cp "$NAMED" net.minecraft.client.MinecraftClient 2>&1 | grep -iE "WindowTitle|windowTitle" | head -10
          echo "== IconProvider/значки"
          javap -p -cp "$NAMED" net.minecraft.client.util.Icons 2>&1 | head -8
          unzip -l "$NAMED" 2>/dev/null | grep -oE "net/minecraft/client/util/[A-Za-z]*Icon[A-Za-z]*\.class" | sort -u | head -8
          exit 0

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: build/libs/*.jar
          if-no-files-found: error
